# Runs luacheck (settings in .luacheckrc) and the tests (tests/run.lua)
# on every push and pull request.
name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run luacheck
        uses: lunarmodules/luacheck@v1

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 (the version WoW uses)
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1"
      - name: Run tests
        run: lua tests/run.lua
